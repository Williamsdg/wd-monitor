name: check
on:
  schedule:
    # Off the quarter-hour marks: GitHub drops a lot of :00/:15/:30/:45 cron firings under load.
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['check.mjs', 'lib/**', 'sites.json', 'package.json', 'package-lock.json']
permissions:
  contents: write
concurrency:
  group: check
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    env:
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      ALERT_TO: ${{ secrets.ALERT_TO }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --omit=dev
      - name: Check sites and commit results
        run: |
          git config user.name "wd-monitor"
          git config user.email "monitor@williamsdigital.io"
          for attempt in 1 2 3; do
            git fetch origin main
            git reset -q --hard origin/main
            node check.mjs
            git add data
            if git diff --cached --quiet; then echo "no change"; exit 0; fi
            git commit -q -m "check: $(date -u +%Y-%m-%dT%H:%MZ) [skip ci]"
            if git push origin HEAD:main; then exit 0; fi
            echo "push rejected (attempt $attempt), another run landed first; re-checking"
            sleep 5
          done
          echo "gave up after 3 attempts"; exit 1
