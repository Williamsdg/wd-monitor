name: check
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['check.mjs', 'lib/**', 'sites.json']
permissions:
  contents: write
concurrency:
  group: check
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node check.mjs
      - name: Commit results
        run: |
          git config user.name "wd-monitor"
          git config user.email "monitor@williamsdigital.io"
          git add data
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -m "check: $(date -u +%Y-%m-%dT%H:%MZ) [skip ci]"
          git pull --rebase --autostash
          git push
